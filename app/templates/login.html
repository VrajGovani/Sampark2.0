{% extends "base.html" %}

{% block title %}Sign In - Sampark{% endblock %}

{% block content %}
<div class="py-12 md:py-20 flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-xl p-8">
        <div class="text-center mb-6">
            <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-3 shadow-sm">
                <i data-lucide="lock" class="w-6 h-6"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-900">Sign In</h2>
            <p class="text-sm text-slate-500 mt-1">Sign in to search vehicle owners & manage your vehicles</p>
        </div>

        <form action="/login" method="POST" class="space-y-4">
            <!-- Hidden Next Redirect Field -->
            <input type="hidden" name="next" value="{{ next_url if next_url else '' }}">

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
                    Phone Number
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i data-lucide="phone" class="w-4 h-4"></i>
                    </span>
                    <input
                        type="text"
                        name="phone"
                        required
                        placeholder="e.g. 9876543210"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-900 font-medium transition"
                    />
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
                    Password
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i data-lucide="key" class="w-4 h-4"></i>
                    </span>
                    <input
                        type="password"
                        name="password"
                        required
                        placeholder="••••••••"
                        class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none text-slate-900 font-medium transition"
                    />
                </div>
            </div>

            <button
                type="submit"
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2 mt-2"
            >
                <span>Sign In</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-500 border-t border-slate-100 pt-5">
            Don't have an account yet?
            <a href="/register{% if next_url %}?next={{ next_url }}{% endif %}" class="text-indigo-600 font-semibold hover:underline">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
